<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{menu_title}}</title>
<meta name="description" content="{{menu_desc}}">
<link rel="alternate" hreflang="en" href="/menu/">
<link rel="alternate" hreflang="tr" href="/tr/menu/">
<meta name="theme-color" content="#F4EFE7">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Figtree:ital,wght@0,400..700;1,400..600&display=swap">
<link rel="stylesheet" href="/scrollcraft.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="page-menu">

<div class="cloth" aria-hidden="true"></div>

<header class="chrome">
  <a class="mark" href="{{home_href}}" aria-label="Nasip Et, {{back_home}}">NASİP<span>-</span>ET</a>
  <nav class="chrome__nav" aria-label="Language">
    <a class="lang" href="{{other_menu_href}}" hreflang="{{other_lang}}" lang="{{other_lang}}">{{other_lang_label}}</a>
  </nav>
</header>

{{{adisyon_html}}}

<main class="menu" id="top">
  <div class="menu__card paper">
    <header class="menu__head">
      <h1 class="h-display">{{menu_h}}</h1>
      <p>{{menu_p}}</p>
      <label class="menu__search">
        <span class="visually-hidden">{{menu_search}}</span>
        <input type="search" placeholder="{{menu_search}}" autocomplete="off" data-menu-search>
      </label>
    </header>
    <nav class="menu__index" aria-label="{{menu_h}}">
      <ul role="list">{{{menu_index_html}}}</ul>
    </nav>
    {{{menu_html}}}
    <p class="menu__none" data-menu-none hidden>{{menu_none}}</p>
    <footer class="menu__foot">
      <p>{{foot_note}}</p>
      <p><a class="link" href="{{home_href}}">{{back_home}}</a></p>
    </footer>
  </div>
</main>

{{{waiter_html}}}

<script type="application/json" id="menu-data">{{{menu_json}}}</script>
<script src="/js/table.js"></script>
<script src="/js/menu.js"></script>
</body>
</html>
